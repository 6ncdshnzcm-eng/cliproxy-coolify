x-cliproxy: &cliproxy
  build:
    context: .
    pull: true
    # Coolify skips automatic ARG injection for interpolated Dockerfile paths.
    dockerfile: ${CLIPROXY_DOCKERFILE:-Dockerfile}
    args:
      CLIPROXY_IMAGE: ${CLIPROXY_IMAGE:-eceasy/cli-proxy-api:latest}
  restart: unless-stopped
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment: &cliproxy-env
    CLIPROXY_API_KEY: ${CLIPROXY_API_KEY:-}
    MANAGEMENT_PASSWORD: ${CLIPROXY_MANAGEMENT_KEY:-}
    SERVICE_PASSWORD_64_CLIPROXYAPI: ${SERVICE_PASSWORD_64_CLIPROXYAPI:-}
    SERVICE_PASSWORD_64_CLIPROXYMANAGEMENT: ${SERVICE_PASSWORD_64_CLIPROXYMANAGEMENT:-}
  volumes:
    - cliproxy-data:/data
  healthcheck:
    test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:8317/healthz"]
    interval: 15s
    timeout: 5s
    start_period: 20s
    retries: 3

services:
  cliproxy:
    <<: *cliproxy
    profiles: [direct, "${SERVICE_NAME_CLIPROXY:-cliproxy}"]
    expose:
      - "8317"
    environment:
      <<: *cliproxy-env
      # Coolify seeds the editable project variable from the generated service name.
      COMPOSE_PROFILES: $SERVICE_NAME_CLIPROXY
      CLIPROXY_ACTIVE_PROFILE: ${COMPOSE_PROFILES:-direct}
      CLIPROXY_DIRECT_PROFILE: ${SERVICE_NAME_CLIPROXY:-cliproxy}
      CLIPROXY_PROFILE: direct
      SERVICE_URL_CLIPROXY_8317: "/"
      CLIPROXY_PUBLIC_URL: ${SERVICE_URL_CLIPROXY_8317:-}

  cliproxy-bundled:
    <<: *cliproxy
    profiles: [bundled]
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      <<: *cliproxy-env
      CLIPROXY_ACTIVE_PROFILE: ${COMPOSE_PROFILES:-direct}
      CLIPROXY_PROFILE: bundled
      CLIPROXY_PUBLIC_URL: ${SERVICE_URL_GLUETUN_8317:-}

  cliproxy-external:
    <<: *cliproxy
    profiles: [external]
    network_mode: "container:${GLUETUN_CONTAINER:-__set_GLUETUN_CONTAINER__}"
    environment:
      <<: *cliproxy-env
      CLIPROXY_ACTIVE_PROFILE: ${COMPOSE_PROFILES:-direct}
      CLIPROXY_PROFILE: external
      CLIPROXY_PUBLIC_URL: ${CLIPROXY_PUBLIC_URL:-}

  gluetun:
    profiles: [bundled]
    # Keep registry access scoped to this profile even when Coolify pre-pulls images.
    build:
      context: .
      pull: true
      dockerfile: ${GLUETUN_DOCKERFILE:-Dockerfile.gluetun}
      args:
        GLUETUN_IMAGE: ${GLUETUN_IMAGE:-ghcr.io/qdm12/gluetun:latest}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    expose:
      - "8317"
    environment:
      SERVICE_URL_GLUETUN_8317: "/"
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-custom}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_ENDPOINT_IP: ${WIREGUARD_ENDPOINT_IP:-}
      WIREGUARD_ENDPOINT_PORT: ${WIREGUARD_ENDPOINT_PORT:-}
      WIREGUARD_PUBLIC_KEY: ${WIREGUARD_PUBLIC_KEY:-}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      WIREGUARD_PRESHARED_KEY: ${WIREGUARD_PRESHARED_KEY:-}
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
      FIREWALL_INPUT_PORTS: "8317"
      HTTP_CONTROL_SERVER_ADDRESS: 127.0.0.1:8000
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      start_period: 45s
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  cliproxy-data:
